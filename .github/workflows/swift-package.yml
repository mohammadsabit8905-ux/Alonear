
name: Alonear Swift Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
